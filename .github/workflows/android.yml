name: Compilar APK

# Se puede ejecutar a mano (pestaña Actions → Compilar APK → Run workflow)
# y se ejecuta también en cada cambio subido a la rama principal.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web (PWA)
        run: npm run build

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El servidor de GitHub (ubuntu-latest) ya trae el Android SDK con las licencias aceptadas.
      - name: Comprobar el Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      # Con los secretos de firma se genera un APK «release» firmado con la clave propia.
      # Sin ellos se genera uno de depuración (solo para pruebas).
      - name: Compilar el APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          mkdir -p apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/inverclima.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/inverclima.jks"
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk "apk/InverClima-v${{ github.run_number }}.apk"
            rm -f "$RUNNER_TEMP/inverclima.jks"
            echo "FIRMA=propia" >> "$GITHUB_ENV"
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk "apk/InverClima-v${{ github.run_number }}-prueba.apk"
            echo "FIRMA=depuracion" >> "$GITHUB_ENV"
          fi

      - name: Publicar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: APK-InverClima
          path: apk/*.apk
          retention-days: 90

      - name: Crear una versión con enlace de descarga directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v${{ github.run_number }}" apk/*.apk \
            --title "InverClima · APK v${{ github.run_number }}" \
            --notes "APK de InverClima (firma: ${FIRMA}). Antes de instalar, activa «Instalar aplicaciones desconocidas» para el navegador o el gestor de archivos."
