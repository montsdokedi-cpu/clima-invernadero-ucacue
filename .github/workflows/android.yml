name: Compilar APK

# Se puede ejecutar a mano (pestaña Actions → Compilar APK → Run workflow)
# y se ejecuta también en cada cambio subido a la rama principal.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web (PWA)
        run: npm run build

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El servidor de GitHub (ubuntu-latest) ya trae el Android SDK con las licencias aceptadas.
      - name: Comprobar el Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar el APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/Clima-Invernadero-UCACUE-v${{ github.run_number }}.apk"

      - name: Publicar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: APK-Clima-Invernadero-UCACUE
          path: apk/*.apk
          retention-days: 90

      - name: Crear una versión con enlace de descarga directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v${{ github.run_number }}" apk/*.apk \
            --title "Clima Invernadero UCACUE · APK v${{ github.run_number }}" \
            --notes "APK de prueba (firma de depuración) para instalar en Android. Antes de instalar, activa «Instalar aplicaciones desconocidas» para el navegador o el gestor de archivos."
